<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pontszám Pörgés & Pop-Up Tesztelő</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: #774046;
      color: #fff5f7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* ÉLŐ JÁTÉK ELŐNÉZET */
    .preview-area {
      width: 100%;
      max-width: 400px;
      min-height: 380px;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      align-items: center;
      text-align: center;
      margin-bottom: 20px;
    }

    h2 {
      font-size: 3rem;
      font-weight: 900;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.35);
    }

    #final-score {
      font-size: 5.5rem;
      font-weight: 900;
      line-height: 1;
      text-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
    }

    /* GOMBCSOPORT KONTAINER - NAGYOBB TÁVOLSÁGGAL (20px) */
    .btn-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px; /* <--- ITT NÖVELTÜK MEG A TÁVOLSÁGOT */
      width: 100%;
    }

    /* RESTART GOMB POP-UP ANIMÁCIÓVAL */
    #restart-btn {
      padding: 18px 48px;
      font-size: 1.35rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #774046;
      background-color: #fff5f7;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 6px 0 #d9c5c9, 0 10px 20px rgba(0, 0, 0, 0.3);
      
      transform: scale(1);
      opacity: 1;
      transition: transform var(--popup-speed, 0.4s) cubic-bezier(0.175, 0.885, 0.32, 1.275),
                  opacity var(--popup-speed, 0.4s) ease;
    }

    #restart-btn:active {
      transform: scale(0.95) translateY(4px);
    }

    /* MÁSODLAGOS (VIEW LEADERBOARD) GOMB STÍLUSA ÉS POP-UP ANIMÁCIÓJA */
    .secondary-btn {
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #fff5f7;
      background: transparent;
      border: 2px solid #fff5f7;
      border-radius: 12px;
      cursor: pointer;

      transform: scale(1);
      opacity: 1;
      transition: transform var(--popup-speed, 0.4s) cubic-bezier(0.175, 0.885, 0.32, 1.275),
                  opacity var(--popup-speed, 0.4s) ease,
                  background 0.2s ease;
    }

    .secondary-btn:active {
      transform: scale(0.95);
      background: rgba(255, 245, 247, 0.15);
    }

    /* REJTETT ÁLLAPOT (A POP-UP ELŐTT) */
    .pop-hidden {
      opacity: 0 !important;
      transform: scale(0) !important;
      pointer-events: none !important;
    }

    /* IDŐZÍTŐ CSÍK A TESZTELÉSHEZ */
    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
    }

    #progress-bar {
      height: 100%;
      width: 0%;
      background: #ffd700;
      transition: width 0.01s linear;
    }

    /* VEZÉRLŐPANEL */
    .controls {
      background: rgba(0, 0, 0, 0.25);
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      backdrop-filter: blur(5px);
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.9rem;
      font-weight: 600;
      opacity: 0.85;
    }

    input[type="number"] {
      padding: 12px;
      border-radius: 10px;
      border: none;
      font-size: 1.1rem;
      font-weight: 700;
      background: #fff5f7;
      color: #774046;
      outline: none;
    }

    #test-btn {
      padding: 16px;
      font-size: 1.2rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #774046;
      background-color: #fff5f7;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 0 #d9c5c9;
      transition: all 0.1s ease;
      margin-top: 5px;
    }

    #test-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #d9c5c9;
    }
  </style>
</head>
<body>

  <!-- ÉLŐ JÁTÉK ELŐNÉZET -->
  <div class="preview-area">
    <h2>Game Over</h2>
    <div id="final-score">0</div>
    
    <div style="width: 100%;">
      <div class="progress-bar-bg">
        <div id="progress-bar"></div>
      </div>
    </div>

    <!-- GOMBCSOPORT -->
    <div class="btn-group">
      <button id="restart-btn" class="pop-hidden">New Game</button>
      <button id="scoreboard-btn" class="secondary-btn pop-hidden">View Leaderboard</button>
    </div>
  </div>

  <!-- VEZÉRLŐPANEL -->
  <div class="controls">
    <div class="input-group">
      <label for="score-input">Cél pontszám:</label>
      <input type="number" id="score-input" value="3480" step="50">
    </div>

    <div class="input-group">
      <label for="time-input">Pörgés időtartama (másodperc):</label>
      <input type="number" id="time-input" value="4" step="0.5" min="0.5" max="10">
    </div>

    <div class="input-group">
      <label for="popup-speed-input">Pop-Up beugrás sebessége (másodperc):</label>
      <input type="number" id="popup-speed-input" value="0.4" step="0.1" min="0.1" max="2">
    </div>

    <button id="test-btn">Teszt Indítása 🚀</button>
  </div>

  <script>
    const finalScoreElement = document.getElementById('final-score');
    const restartBtn = document.getElementById('restart-btn');
    const scoreboardBtn = document.getElementById('scoreboard-btn');
    const progressBar = document.getElementById('progress-bar');
    const testBtn = document.getElementById('test-btn');

    function animateFinalScore(targetScore, durationSeconds, onComplete) {
      finalScoreElement.textContent = 0;
      progressBar.style.width = '0%';

      if (targetScore === 0) {
        if (onComplete) onComplete();
        return;
      }

      const DURATION = durationSeconds * 1000;
      const startTime = performance.now();

      function stepAnimation(currentTime) {
        const elapsedTime = currentTime - startTime;
        const progress = Math.min(elapsedTime / DURATION, 1);

        progressBar.style.width = (progress * 100) + '%';

        const easeOutProgress = 1 - Math.pow(1 - progress, 3);
        const currentScore = Math.floor(easeOutProgress * targetScore);
        finalScoreElement.textContent = currentScore;

        if (progress < 1) {
          requestAnimationFrame(stepAnimation);
        } else {
          finalScoreElement.textContent = targetScore;
          if (onComplete) onComplete();
        }
      }

      requestAnimationFrame(stepAnimation);
    }

    // TESZT INDÍTÁSA
    testBtn.addEventListener('click', () => {
      const targetScore = parseInt(document.getElementById('score-input').value) || 0;
      const durationSeconds = parseFloat(document.getElementById('time-input').value) || 4;
      const popupSpeed = parseFloat(document.getElementById('popup-speed-input').value) || 0.4;

      restartBtn.style.setProperty('--popup-speed', `${popupSpeed}s`);
      scoreboardBtn.style.setProperty('--popup-speed', `${popupSpeed}s`);

      restartBtn.classList.add('pop-hidden');
      scoreboardBtn.classList.add('pop-hidden');

      animateFinalScore(targetScore, durationSeconds, () => {
        setTimeout(() => {
          restartBtn.classList.remove('pop-hidden');

          setTimeout(() => {
            scoreboardBtn.classList.remove('pop-hidden');
          }, popupSpeed * 1000);

        }, 500);
      });
    });
  </script>
</body>
</html>
