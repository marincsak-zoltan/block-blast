<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Block Blast</title>

  <!-- PWA meta tagek -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffb3c7">
  
  <!-- iOS / Mobile támogatás -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Block Blast">
  <link rel="apple-touch-icon" href="icon.png">

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Mute / Unmute Gomb a jobb felső sarokban -->
  <button id="mute-btn" class="icon-btn" aria-label="Sound Toggle">🔊</button>

  <!-- FELSŐ FEJLÉC ZÓNA -->
  <div class="header-zone">
    <div class="high-score-container">
      <span>👑</span>
      <span id="high-score">0</span>
    </div>

    <div class="score-container">
      <div id="score">0</div>
    </div>
  </div>

  <!-- FŐ JÁTÉKMEZŐ -->
  <div class="board-wrapper">
    <img id="kitty-mascot" src="hellokitty.png" alt="Hello Kitty Mascot" />
    <canvas id="gameCanvas"></canvas>
  </div>

  <!-- Alsó panel a 3 választható blokknak -->
  <div class="pieces-container">
    <canvas id="piece0" class="piece-canvas"></canvas>
    <canvas id="piece1" class="piece-canvas"></canvas>
    <canvas id="piece2" class="piece-canvas"></canvas>
  </div>

  <!-- Fullscreen lebegő canvas a húzáshoz -->
  <canvas id="dragCanvas"></canvas>

  <!-- 1. NÉVMEGADÓ MODAL (Első belépéskor) -->
  <div id="name-modal" class="modal hidden">
    <div class="modal-content">
      <h2>Enter Your Name</h2>
      <input type="text" id="player-name-input" maxlength="12" placeholder="Your Name..." />
      <button id="save-name-btn">Save Name</button>
    </div>
  </div>

  <!-- 2. TELJES KÉPERNYŐS START GAME OVERLAY -->
  <div id="start-game-modal" class="modal">
    <div class="modal-content">
      <div class="title-group">
        <p class="welcome-text">Welcome to</p>
        <h2>Block Blast</h2>
        <span class="version-tag">v2.6.2</span>
      </div>
      <button id="start-btn">Start Game</button>
      <button id="scoreboard-btn" class="secondary-btn">View Leaderboard</button>
    </div>
  </div>

  <!-- 3. TELJES KÉPERNYŐS GAME OVER OVERLAY -->
  <div id="game-over-modal" class="modal hidden">
    <div class="modal-content">
      <h2 id="game-over-title">Game Over</h2>
      <div id="final-score">0</div>
      <p id="gameover-text"></p>
      <button id="restart-btn" class="btn-hidden">New Game</button>
    </div>
  </div>

  <!-- 4. RANGLISTA MODAL -->
  <div id="scoreboard-modal" class="modal hidden">
    <div class="modal-content">
      <h2>Leaderboard</h2>
      <div id="leaderboard-list">
        <!-- Ide töltődnek be a pontszámok -->
      </div>
      <button id="close-scoreboard-btn" class="secondary-btn">Back</button>
    </div>
  </div>

  <script type="module" src="scripts/main.js"></script>
</body>
</html>
