<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Block Blast</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Mute / Unmute Gomb -->
  <button id="mute-btn" class="icon-btn" aria-label="Turn off sounds">🔊</button>

  <!-- Pontszám kijelző -->
  <div class="score-container">
    <span id="score">0</span>
  </div>

  <!-- Játékterület konténer -->
  <div class="board-wrapper">
    <canvas id="gameCanvas"></canvas>
  </div>

  <!-- Alsó panel a 3 választható blokknak -->
  <div class="pieces-container">
    <canvas id="piece0" class="piece-canvas"></canvas>
    <canvas id="piece1" class="piece-canvas"></canvas>
    <canvas id="piece2" class="piece-canvas"></canvas>
  </div>

  <!-- Fullscreen lebegő canvas a húzáshoz -->
  <canvas id="dragCanvas"></canvas>

  <!-- START GAME OVERLAY (Indítás előtti ablak) -->
  <div id="start-game-modal" class="modal">
    <div class="modal-content">
      <h2>Block Blast</h2>
      <p>Welcome!</p>
      <button id="start-btn">Start Game</button>
    </div>
  </div>

  <!-- GAME OVER OVERLAY -->
  <div id="game-over-modal" class="modal hidden">
    <div class="modal-content">
      <h2>Game Over</h2>
      <p>Score: <span id="final-score">0</span></p>
      <button id="restart-btn">New Game</button>
    </div>
  </div>

  <!-- GAME OVER OVERLAY (Középen a board felett) -->
  <div id="game-over-modal" class="modal hidden">
    <div class="modal-content">
      <h2>Game Over</h2>
      <p>Score: <span id="final-score">0</span></p>
      <button id="restart-btn">New Game</button>
    </div>
  </div>

  <script type="module" src="scripts/main.js"></script>
</body>
</html>
